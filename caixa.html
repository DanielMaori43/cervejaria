<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa Profissional - Cervejaria Mandela</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
  <header class="topo">
    <img src="logo do bar 1.jpg" alt="Logo Cervejaria e Petiscaria Mandela" class="logo-principal">

  </header>

  <div class="containermesa">
    <nav class="garçom">
      <button onclick="window.location.href='index.html'">Caixa</button>
    </nav>

    
  </div>
  <h1>Caixa Profissional</h1>

  <div class="mesas-grid" id="mesasContainer"></div>

  <button class="historico-btn" onclick="mostrarHistorico()">Ver Histórico</button>
  <div id="historicoContainer"></div>

  <!-- Modal de pedidos -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2 id="modalTitulo"></h2>
      <ul id="modalPedidos"></ul>
      <button class="cancelar" onclick="cancelarMesaModal()">Cancelar Mesa</button>
      <button class="fechar" onclick="fecharMesaModal()">Fechar Mesa</button>
      <button onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
