<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cervejaria e Petiscaria Mandela</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
      max-height: 80%;
      overflow-y: auto;
      text-align: left;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .modal h2 { margin-bottom: 15px; color:#3b0a0a; }
    .modal button {
      background: #3b0a0a;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    .modal button:hover { background: #5a1a1a; }

    /* Mesas ocupadas/livres */
    .mesa { cursor: pointer; display: inline-block; margin: 10px; text-align: center; transition: transform 0.2s; }
    .mesa img { width: 80px; height: 80px; transition: transform 0.2s; }
    .mesa span { display: block; margin-top: 15px; font-weight: bold; }
    .mesa.ocupada img { border: 3px solid #d9534f; border-radius: 8px; }
    .mesa.livre img { border: 3px solid #5cb85c; border-radius: 8px; }
    .mesa:hover img { transform: scale(1.1); }
  </style>
</head>

<body>

  <!-- Logo principal -->
  <header class="topomesa">
    <img src="logo do bar 1.jpg" alt="Logo Cervejaria e Petiscaria Mandela" class="logo-principal">
  </header>

  <div class="containermesa">
    <!-- Botão voltar -->
    <nav class="menumesa">
      <button onclick="window.location.href='index.html'">Mesas</button>
    </nav>

    <!-- Mesas -->
    <section class="mesas-container">
      <!-- Mesas geradas pelo JS -->
    </section>
  </div>

  <!-- Modal de pedidos -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2 id="tituloMesa"></h2>
      <div id="pedidosMesa"></div>
      <button onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <!-- Logo secundário -->
  <footer class="rodapemesa">
    <img src="mandelanovo.png" alt="Logo Mandela pequeno">
  </footer>

  <script>
    const totalMesas = 9; // Número de mesas

    // Função para gerar as mesas dinamicamente
    function gerarMesas() {
      const container = document.querySelector('.mesas-container');
      const pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];

      container.innerHTML = ''; // Limpa antes de gerar

      for (let i = 1; i <= totalMesas; i++) {
        const mesaPedidos = pedidos.filter(p => String(p.mesa) === String(i));
        const statusClasse = mesaPedidos.length ? 'ocupada' : 'livre';

        const div = document.createElement('div');
        div.className = `mesa ${statusClasse}`;
        div.onclick = () => abrirMesa(i);

        div.innerHTML = `
          <img src="mesa.png" alt="Mesa ${i}">
          <span>Mesa ${i}</span>
        `;

        container.appendChild(div);
      }
    }

    function abrirMesa(numeroMesa) {
      const modal = document.getElementById("modalOverlay");
      const titulo = document.getElementById("tituloMesa");
      titulo.textContent = "Pedidos da Mesa " + numeroMesa;

      renderMesa(numeroMesa);
      modal.style.display = "flex";
    }

    function fecharModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    function renderMesa(numeroMesa) {
      const container = document.getElementById("pedidosMesa");
      if (!container) return;

      const pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
      const pedidosMesa = pedidos.filter(p => String(p.mesa) === String(numeroMesa));

      if (!pedidosMesa.length) {
        container.innerHTML = "<p>Nenhum pedido nesta mesa ainda.</p>";
        return;
      }

      let html = "<ul>";
      pedidosMesa.forEach(p => {
        const quantidade = Number(p.quantidade) || 0;
        const valor = Number(p.valor) || 0;
        const subtotal = Number(p.subtotal) || quantidade * valor;
        const itemNome = p.item || "Item não informado";

        html += `
          <li>
            ${quantidade}x ${itemNome} - R$${valor.toFixed(2)}
            = <strong>R$${subtotal.toFixed(2)}</strong>
            ${p.obs ? `<em>(${p.obs})</em>` : ""}
          </li>
        `;
      });
      html += "</ul>";

      const total = pedidosMesa.reduce((s, p) => {
        const subtotal = Number(p.subtotal) || (Number(p.quantidade) || 0) * (Number(p.valor) || 0);
        return s + subtotal;
      }, 0);

      html += `<p><strong>Total: R$${total.toFixed(2)}</strong></p>`;

      container.innerHTML = html;
    }

    // Atualiza mesas ao carregar a página
    window.addEventListener('DOMContentLoaded', gerarMesas);

    // Atualiza visualização das mesas sempre que o modal fechar (para refletir alterações)
    window.addEventListener('storage', gerarMesas);
  </script>
</body>

</html>
